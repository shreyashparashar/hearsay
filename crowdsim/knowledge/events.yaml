# Historical public-reaction library.
#
# Every number here is a HAND-CODED ESTIMATE on a common scale, made from widely reported public
# facts, so events can be compared with each other. They are not measurements. Use
# `python tools/learn_attention.py` to replace attention numbers with real Wikipedia-pageview
# curves where available, and add your own events in the same format.
#
# features (what the event was like when it hit):
#   valence      -1..1  how it first reflected on the brand/organisation
#   emotionality  0..1  how much it made people feel something (anger, delight, fear)
#   identity      0..1  how much it touched values, politics, group identity
#   lean         -1..1  which side of the cultural axis it flattered (-1 progressive-coded, +1 traditional-coded)
#   harm          0..1  physical, financial or personal harm to people
#   responsibility 0..1 how much the organisation was to blame
#   hype          0..1  anticipation beforehand
#   price         0..1  how central money/price was
#   prominence    0..1  how famous the brand was
#   novelty       0..1  how surprising it was
# outcome:
#   awareness 0..1 of the main market's public · halflife_days of attention · peak_day
#   opinion_shift -1..1 · commercial -1..1 (sales/users/value) · polarization 0..1
# response: what the organisation did and roughly how many hours it took.

events:
  - id: iphone_2007
    name: Apple unveils the iPhone
    year: 2007
    archetype: product_launch
    features: {valence: 0.8, emotionality: 0.7, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 0.0, hype: 0.95, price: 0.5, prominence: 0.8, novelty: 1.0}
    outcome: {awareness: 0.8, halflife_days: 6, peak_day: 0, opinion_shift: 0.3, commercial: 0.9, polarization: 0.2}
    response: {type: none, hours: null}
    summary: Unveiled on stage in January 2007 and shipped in June; months of anticipation, sustained coverage and lines at stores on release day.
    lessons: [A live, demo-led reveal followed by a wait before release stretches attention over months.]

  - id: note7_2016
    name: Samsung Galaxy Note 7 battery fires
    year: 2016
    archetype: safety_defect
    wiki: {title: Samsung_Galaxy_Note_7, date: 2016-08-24}
    features: {valence: -0.8, emotionality: 0.9, identity: 0.0, lean: 0.0, harm: 0.8, responsibility: 0.9, hype: 0.6, price: 0.2, prominence: 0.9, novelty: 0.7}
    outcome: {awareness: 0.85, halflife_days: 10, peak_day: 40, opinion_shift: -0.4, commercial: -0.7, polarization: 0.1}
    response: {type: recall, hours: 216}
    summary: Overheating batteries led to a recall in September 2016; replacement phones also caught fire, the model was discontinued in October and banned from flights. Samsung's next flagship sold well the following year.
    lessons:
      - Physical-harm stories escalate through regulators and airlines, not just social media.
      - A fix that fails is worse than the original defect.

  - id: tylenol_1982
    name: Tylenol poisonings and recall
    year: 1982
    archetype: safety_defect
    features: {valence: -0.7, emotionality: 0.95, identity: 0.0, lean: 0.0, harm: 1.0, responsibility: 0.1, hype: 0.0, price: 0.0, prominence: 0.8, novelty: 0.9}
    outcome: {awareness: 0.95, halflife_days: 14, peak_day: 3, opinion_shift: -0.3, commercial: -0.5, polarization: 0.05}
    response: {type: recall, hours: 120}
    summary: After capsules were laced with cyanide in Chicago, Johnson & Johnson recalled about 31 million bottles nationwide and introduced tamper-resistant packaging; the brand largely recovered within about a year.
    lessons:
      - Fast, costly, customer-first action rebuilt trust even after deaths.
      - When the company is also a victim, the public credits visible sacrifice.

  - id: new_coke_1985
    name: New Coke replaces the original formula
    year: 1985
    archetype: rebrand
    features: {valence: -0.4, emotionality: 0.7, identity: 0.3, lean: -0.3, harm: 0.0, responsibility: 1.0, hype: 0.6, price: 0.0, prominence: 1.0, novelty: 0.8}
    outcome: {awareness: 0.9, halflife_days: 20, peak_day: 30, opinion_shift: -0.3, commercial: -0.2, polarization: 0.3}
    response: {type: reversal, hours: 1900}
    summary: Coca-Cola changed its formula in April 1985; loyal drinkers protested by letter and phone, and the original returned as Coca-Cola Classic 79 days later.
    lessons:
      - Taste tests didn't measure attachment; nostalgic loyalists are louder than their numbers.
      - Reversing course turned the backlash into renewed affection for the original.

  - id: bud_light_2023
    name: Bud Light boycott
    year: 2023
    archetype: values_controversy
    wiki: {title: 2023_Bud_Light_boycott, date: 2023-04-01}
    features: {valence: -0.2, emotionality: 0.9, identity: 0.95, lean: -0.8, harm: 0.0, responsibility: 0.6, hype: 0.2, price: 0.0, prominence: 0.9, novelty: 0.6}
    outcome: {awareness: 0.8, halflife_days: 8, peak_day: 7, opinion_shift: -0.4, commercial: -0.7, polarization: 0.9}
    response: {type: noncommittal_statement, hours: 300}
    summary: A promotional can for transgender influencer Dylan Mulvaney in April 2023 set off a boycott by conservative drinkers; the brand's response satisfied neither side, US sales fell sharply for months and Modelo Especial overtook it as America's top-selling beer.
    lessons:
      - Boycotts bite when the product is easy to substitute and consuming it is socially visible.
      - A response that tries to please both sides can alienate both.

