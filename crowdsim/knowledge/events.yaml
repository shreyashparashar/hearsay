# Historical public-reaction library.
#
# Every number here is a HAND-CODED ESTIMATE on a common scale, made from widely reported public
# facts, so events can be compared with each other. They are not measurements. Use
# `python tools/learn_attention.py` to replace attention numbers with real Wikipedia-pageview
# curves where available, and add your own events in the same format.
#
# features (what the event was like when it hit):
#   valence      -1..1  how it first reflected on the brand/organisation
#   emotionality  0..1  how much it made people feel something (anger, delight, fear)
#   identity      0..1  how much it touched values, politics, group identity
#   lean         -1..1  which side of the cultural axis it flattered (-1 progressive-coded, +1 traditional-coded)
#   harm          0..1  physical, financial or personal harm to people
#   responsibility 0..1 how much the organisation was to blame
#   hype          0..1  anticipation beforehand
#   price         0..1  how central money/price was
#   prominence    0..1  how famous the brand was
#   novelty       0..1  how surprising it was
# outcome:
#   awareness 0..1 of the main market's public · halflife_days of attention · peak_day
#   opinion_shift -1..1 · commercial -1..1 (sales/users/value) · polarization 0..1
# response: what the organisation did and roughly how many hours it took.
# domain: brand | policy | economy | geopolitics | health | politics | labour | tech  · country: main market
# For governments, parties and countries, "brand" means whoever is at the centre of the event, and
# commercial means how well it went for them in practical terms (-1 failed or reversed .. +1 achieved its aims).

events:
  - id: iphone_2007
    name: Apple unveils the iPhone
    year: 2007
    archetype: product_launch
    domain: brand
    country: "Global"
    features: {valence: 0.8, emotionality: 0.7, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 0.0, hype: 0.95, price: 0.5, prominence: 0.8, novelty: 1.0}
    outcome: {awareness: 0.8, halflife_days: 6, peak_day: 0, opinion_shift: 0.3, commercial: 0.9, polarization: 0.2}
    response: {type: none, hours: null}
    summary: Unveiled on stage in January 2007 and shipped in June; months of anticipation, sustained coverage and lines at stores on release day.
    lessons: [A live, demo-led reveal followed by a wait before release stretches attention over months.]

