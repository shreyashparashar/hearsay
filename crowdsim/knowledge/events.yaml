    year: 2018
    archetype: values_controversy
    wiki: {title: Dream_Crazy, date: 2018-09-03}
    features: {valence: 0.1, emotionality: 0.9, identity: 0.95, lean: -0.8, harm: 0.0, responsibility: 0.5, hype: 0.5, price: 0.0, prominence: 1.0, novelty: 0.6}
    outcome: {awareness: 0.85, halflife_days: 5, peak_day: 1, opinion_shift: 0.0, commercial: 0.3, polarization: 0.95}
    response: {type: stand_firm, hours: 0}
    summary: The September 2018 ad drew boycott calls and videos of people burning their shoes; Nike held firm, third-party data showed online sales rising, and its share price later hit record highs.
    lessons:
      - When core customers sit on one side of a values split, the other side's boycott can be outweighed by a buycott.
      - Holding firm reads as conviction, and works when the stance matches the core audience.

