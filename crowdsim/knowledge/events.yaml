    outcome: {awareness: 0.7, halflife_days: 10, peak_day: 3, opinion_shift: -0.5, commercial: -0.3, polarization: 0.1}
    response: {type: apology, hours: 120}
    summary: Volkswagen admitted in September 2015 that diesel cars carried software to cheat emissions tests; the CEO resigned within days and the company faced tens of billions in fines and settlements.
    lessons: [Deliberate deception damages trust far more than accidents do.]

