    response: {type: stand_firm, hours: 0}
    summary: When Netflix began charging for password sharing in 2023, social media filled with cancellation threats, yet it reported millions of new subscribers in the following quarters.
    lessons: [Online outrage is a poor predictor of behaviour when the product is a habit and the alternative is losing access.]

