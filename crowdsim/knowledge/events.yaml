    summary: The game launched in December 2020 with severe bugs on older consoles; Sony pulled it from the PlayStation Store and refunds were offered. Years of patches and an expansion later repaired much of its reputation.
    lessons:
      - Peak hype raises the fall; expectations are the baseline the public judges against.
      - Recovery is possible but takes years of visible fixes.

