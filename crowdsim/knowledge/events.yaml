    summary: A demonstration meant to show unbreakable windows cracked them on stage in November 2019. The moment became a meme, yet Elon Musk reported roughly 250,000 refundable reservations within days.
    lessons:
      - A launch gaffe can widen reach without denting demand among fans when commitment is cheap and refundable.
      - Polarising design splits opinion sharply; loved and mocked at once.

