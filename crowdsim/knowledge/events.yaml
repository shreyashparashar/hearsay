    summary: Microsoft's plan to require regular online check-ins and restrict used games drew fierce backlash; Sony mocked it at E3 and Microsoft reversed the policy within about a month, before launch.
    lessons: [Reversing before launch limits lasting damage, but the competitor keeps the narrative win.]

