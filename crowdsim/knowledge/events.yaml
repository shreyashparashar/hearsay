    archetype: data_breach
    wiki: {title: 2017_Equifax_data_breach, date: 2017-09-07}
    features: {valence: -0.9, emotionality: 0.8, identity: 0.0, lean: 0.0, harm: 0.7, responsibility: 0.9, hype: 0.0, price: 0.0, prominence: 0.6, novelty: 0.8}
