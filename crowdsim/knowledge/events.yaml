    response: {type: compensation, hours: 200}
    summary: Apple confirmed in December 2017 that it slowed some older iPhones to prevent shutdowns from ageing batteries; it apologised and cut battery replacement prices to $29, but faced lawsuits and fines.
    lessons: [Hidden decisions feel like deception even when the motive is technical.]

