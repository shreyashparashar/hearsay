    archetype: safety_defect
    features: {valence: -0.4, emotionality: 0.5, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 0.7, hype: 0.8, price: 0.0, prominence: 1.0, novelty: 0.6}
    outcome: {awareness: 0.5, halflife_days: 6, peak_day: 14, opinion_shift: -0.1, commercial: 0.0, polarization: 0.3}
    response: {type: dismissive_then_fix, hours: 500}
    summary: The iPhone 4 lost signal when held a certain way; Steve Jobs's advice to avoid holding it that way was mocked, and about three weeks later Apple gave out free cases. Sales stayed strong.
    lessons:
      - Dismissive replies prolong minor defects; a cheap fix ends them.
      - Devoted fans and network effects absorb minor defects.

