      - Churn is real when alternatives exist and the change feels like a downgrade.

  - id: netflix_sharing_2023
    name: Netflix password-sharing crackdown
    year: 2023
    archetype: price_change
    features: {valence: -0.5, emotionality: 0.6, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 1.0, hype: 0.0, price: 0.7, prominence: 0.9, novelty: 0.5}
