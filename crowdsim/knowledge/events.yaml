    summary: The 2019 ad in which a husband gifts his wife an exercise bike was mocked as tone-deaf; the share price fell, and Aviation Gin quickly released a parody starring the same actress.
    lessons:
      - Competitors can ride your backlash within days.
      - Mockery spreads faster than anger and is harder to answer.

