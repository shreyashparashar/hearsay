    year: 2023
    archetype: price_change
    wiki: {title: Unity_(game_engine), date: 2023-09-12}
    features: {valence: -0.8, emotionality: 0.85, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 0.9, hype: 0.0, price: 1.0, prominence: 0.5, novelty: 0.8}
