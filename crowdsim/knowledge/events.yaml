  - id: qwikster_2011
    name: Netflix price hike and Qwikster
    year: 2011
    archetype: price_change
    features: {valence: -0.7, emotionality: 0.7, identity: 0.0, lean: 0.0, harm: 0.0, responsibility: 1.0, hype: 0.0, price: 0.9, prominence: 0.8, novelty: 0.7}
