    response: {type: slow_disclosure, hours: 1000}
    summary: Equifax disclosed in September 2017 that data on about 147 million people had been exposed; it had found the breach weeks earlier, its help website was confusing, and the CEO retired within weeks.
    lessons:
      - Late disclosure turns a breach into a cover-up story.
      - Clumsy remediation tools create a second wave of anger.

