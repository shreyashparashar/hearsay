    response: {type: apology_then_reversal, hours: 700}
    summary: Netflix raised some prices by about 60% in 2011, then announced it would split DVD rentals into a separate service called Qwikster; it lost about 800,000 US subscribers in a quarter and dropped Qwikster within weeks.
