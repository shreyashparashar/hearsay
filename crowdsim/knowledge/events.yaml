    name: Apple slows older iPhones
    year: 2017
    archetype: trust_scandal
    wiki: {title: Batterygate, date: 2017-12-20}
    features: {valence: -0.6, emotionality: 0.6, identity: 0.0, lean: 0.0, harm: 0.1, responsibility: 0.9, hype: 0.0, price: 0.4, prominence: 1.0, novelty: 0.6}
