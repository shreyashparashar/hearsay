    outcome: {awareness: 0.8, halflife_days: 7, peak_day: 3, opinion_shift: -0.35, commercial: -0.15, polarization: 0.4}
    response: {type: silence_then_apology, hours: 120}
    summary: Reports in March 2018 that Cambridge Analytica had obtained data on tens of millions of Facebook users sparked #DeleteFacebook and congressional testimony by Mark Zuckerberg; the share price fell sharply, but user numbers kept growing.
    lessons:
      - Loud online exits rarely match actual churn when a service has strong network effects.
      - Silence in the first days lets critics define the story.

