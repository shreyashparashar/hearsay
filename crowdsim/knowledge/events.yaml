    outcome: {awareness: 0.5, halflife_days: 4, peak_day: 2, opinion_shift: -0.3, commercial: -0.1, polarization: 0.05}
    response: {type: apology, hours: 48}
    summary: Two employees posted a video of themselves tampering with food in April 2009; Domino's answered with a YouTube apology from its US president within about two days, and later rebuilt its image by openly admitting its pizza needed to improve.
    lessons:
      - Answering on the platform where the crisis lives beats press releases.
      - Admitting a flaw openly can become a comeback story.

  - id: bp_2010
    name: Deepwater Horizon oil spill
    year: 2010
    archetype: disaster
    features: {valence: -1.0, emotionality: 0.95, identity: 0.3, lean: -0.3, harm: 1.0, responsibility: 1.0, hype: 0.0, price: 0.0, prominence: 0.9, novelty: 0.9}
    outcome: {awareness: 0.95, halflife_days: 30, peak_day: 40, opinion_shift: -0.6, commercial: -0.6, polarization: 0.2}
    response: {type: slow_and_gaffe, hours: 72}
    summary: The April 2010 explosion killed 11 workers and caused the largest marine oil spill in US history; CEO Tony Hayward's "I'd like my life back" came to symbolise a response seen as self-absorbed, and he was replaced within months.
    lessons:
      - Visible, ongoing harm keeps a crisis alive for months; every update restarts the cycle.
      - Leaders' off-hand remarks become the headline.

