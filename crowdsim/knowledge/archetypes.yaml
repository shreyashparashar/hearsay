    - {id: bring_it_back, label: '"bring back the old one"', kind: movement, valence: -0.5, credibility: 0.6, emotionality: 0.8, identity: 0.5, lean: 0.5, start: 12, seed: {target: "segment:long-time customers", share: 0.0003}, media_pickup: {threshold: 0.02, delay: 3, duration: 36, intensity: 0.04}, description: Nostalgic customers demand a reversal.}

