    - {name: privacy advocates, share: 0.02, baseline_opinion: -0.35, traits: {expressiveness: 0.3, skepticism: 0.6}}
    - {name: general public, share: 0.83, baseline_opinion: 0.05}
  stories:
    - {id: everything_leaked, label: '"everything was leaked" claims', kind: rumor, truth: false, valence: -0.9, credibility: 0.3, emotionality: 0.95, start: 8, seed: {target: "segment:privacy advocates", share: 0.0003}, media_pickup: {threshold: 0.015, delay: 4, duration: 24, intensity: 0.03}, description: The breach is exaggerated as it spreads.}
    - {id: protect_yourself, label: how-to-protect-yourself guides, kind: news, valence: -0.15, credibility: 0.9, emotionality: 0.3, start: 12, seed: {target: active, count: 60}, media: [{start: 12, end: 48, intensity: 0.02}], description: Media explain what affected people should do.}
    - {id: lawsuit, label: class-action lawsuit, kind: news, valence: -0.5, credibility: 0.85, emotionality: 0.5, start: 96, seed: {target: influencers, count: 20}, media: [{start: 96, end: 120, intensity: 0.03}], description: Lawyers file on behalf of customers.}

