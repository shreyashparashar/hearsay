# What tends to happen around each kind of event, distilled from the event library.
# `stories` are the secondary narratives that historically emerge on their own; each has a start
# hour, an optional `when` condition on the event's features, and seeding. Special values:
#   lean: same | opposite      -> copies or flips the event's cultural lean
#   identity: same             -> copies the event's identity charge
#   seed target: lean_same | lean_opposite -> activists on that side of the cultural axis
# `dynamics` override engine constants for this archetype; `crisis: true` adds a silence penalty
# when the organisation doesn't respond within 48 hours. `mode: decide` means the question is whether to
# go ahead (launches, policies); `respond` means it already happened and the question is how to answer.
# `words` are how the plain-language report talks about taking it up and walking away.

product_launch:
  label: Product launch
  words: {subject: the product, adopt: bought it, adopters: potential buyers, churn: walked away, customers: existing customers}
  core_kind: official
  crisis: false
  dynamics: {novelty_halflife: 48, adopt_base_rate: 0.002, churn_rate: 0.001}
  audience:
    - {name: existing customers, share: 0.08, baseline_opinion: 0.5, can_adopt: true, need: 0.6, price_sensitivity: 0.35, traits: {trust_brand: 0.7}}
    - {name: in-market shoppers, share: 0.2, baseline_opinion: 0.05, can_adopt: true, need: 0.65, price_sensitivity: 0.55}
    - {name: rival loyalists, share: 0.14, baseline_opinion: -0.3, can_adopt: true, need: 0.35, price_sensitivity: 0.5, traits: {trust_brand: 0.3}}
    - {name: general public, share: 0.58, baseline_opinion: 0.0, can_adopt: false, activity: 0.8}
  stories:
    - {id: hands_on_reviews, label: early hands-on reviews, kind: news, valence: quality, credibility: 0.8, emotionality: 0.4, start: 24, seed: {target: active, share: 0.0002}, media: [{start: 24, end: 60, intensity: 0.03}], description: Press and creators publish first impressions.}
    - {id: price_gripes, label: complaints about the price, kind: ugc, when: "price>0.55", valence: -0.4, credibility: 0.6, emotionality: 0.6, start: 4, seed: {target: active, share: 0.0003}, description: '"Who is this even for at that price?"'}
    - {id: hype_memes, label: hype memes, kind: ugc, when: "hype>0.6", valence: 0.3, credibility: 0.5, emotionality: 0.8, start: 2, seed: {target: active, share: 0.0003}, description: Fans turn the reveal into jokes and reaction posts.}
    - {id: rival_jab, label: a rival's jab, kind: ad, source: none, when: "prominence>0.6", valence: -0.2, credibility: 0.55, emotionality: 0.5, start: 30, seed: {target: influencers, count: 20}, description: A competitor pokes fun at the launch.}

