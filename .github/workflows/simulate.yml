# Free cloud runs: Actions tab -> "simulate" -> Run workflow.
# Public repos get free minutes on 4-core/16 GB runners; a 1M-agent, 14-day run takes ~3-5 min per run.
# Report lands as a downloadable artifact AND (if Pages is enabled with source "GitHub Actions")
# at https://<you>.github.io/<repo>/
name: simulate
on:
  workflow_dispatch:
    inputs:
      scenario: {description: "scenario file", default: "scenarios/product_launch.yaml"}
      size: {description: "number of agents", default: "1000000"}
      runs: {description: "Monte-Carlo runs", default: "3"}
      extra: {description: "extra args, e.g. --set narratives.company_denial.start=36", default: ""}
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m crowdsim run "${{ inputs.scenario }}" --size "${{ inputs.size }}" --runs "${{ inputs.runs }}" ${{ inputs.extra }} --out site
      - run: cp site/report.html site/index.html
      - uses: actions/upload-artifact@v4
        with: {name: simulation-report, path: site}
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  pages:
    needs: simulate
    runs-on: ubuntu-latest
    continue-on-error: true      # fine if Pages isn't enabled; the artifact is still there
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
